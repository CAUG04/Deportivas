name: Daily

# Fase 8/9: ingesta incremental de calendario/stats (segun la cadencia
# daily/weekly de cada competicion), entrenamiento de modelos, cierre de
# linea, senales y liquidacion -- todo lo que scripts/run_daily_pipeline.sh
# ya decide por competicion. Este workflow solo aporta lo que un script
# local no puede: el cron, y el Release de GitHub que hace de disco
# persistente entre corridas (ver "Arquitectura de despliegue gratuito" en
# el README).
#
# No construye ni publica el frontend: deploy.yml hace el export a JSON y
# el build justo despues, encadenado por "workflow_run" sobre este workflow
# y sobre Odds -- asi el sitio siempre exporta el dato mas fresco posible
# sin que este workflow tenga que saber nada de Vite ni de GitHub Pages.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC, todos los dias
  workflow_dispatch:

# Mismo grupo que odds.yml a proposito: ambos leen y publican el mismo
# asset del Release "data-lake" (scripts/{restore,publish}_data_lake.sh), y
# dos corridas escribiendolo a la vez se pisarian una a otra. "queue" en vez
# de "cancel-in-progress" para que una corrida completa siempre termine de
# publicar antes de que empiece la siguiente.
concurrency:
  group: deportivas-data-lake
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  # FBref bloquea con CAPTCHA a los runners de GitHub Actions -- confirmado
  # en produccion incluso con DEPORTIVAS_FBREF_HEADLESS=false + Xvfb +
  # "xvfb-run" (ver README "FBref bloquea con CAPTCHA..."): el solver de
  # soccerdata si intenta resolver el CAPTCHA de verdad con esa combinacion,
  # pero FBref gana igual. Con el resultado ya confirmado y repetible,
  # intentarlo en cada corrida es tiempo de CI perdido: se desactiva del
  # todo (Settings.fbref_enabled sigue en true por defecto para uso manual
  # local, ver .env.example).
  DEPORTIVAS_FBREF_ENABLED: "false"

jobs:
  daily-pipeline:
    name: Ingesta incremental + modelos + liquidacion
    runs-on: ubuntu-latest
    # 60, no 180: los 180 minutos eran para absorber 2 llamadas a FBref por
    # competicion (schedule + stats) con reintentos de CAPTCHA de por medio.
    # Con DEPORTIVAS_FBREF_ENABLED=false arriba, esta corrida ya no toca
    # FBref -- solo Understat/football-data.co.uk/ESPN (HTTP simple) mas
    # features/modelos/liquidacion de los 5 deportes. Se deja margen sobre
    # la estimacion de partida porque no hay todavia una corrida real medida
    # sin FBref.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Instalar Python 3.11
        run: uv python install 3.11

      - name: Instalar dependencias (lockfile exacto)
        run: uv sync --all-extras --frozen

      - name: Restaurar data lake (GitHub Release)
        run: ./scripts/restore_data_lake.sh

      - name: Pipeline diario
        run: ./scripts/run_daily_pipeline.sh

      - name: Publicar data lake (GitHub Release)
        if: always()
        run: ./scripts/publish_data_lake.sh

  notify-on-failure:
    needs: [daily-pipeline]
    if: failure()
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: Daily
      label: pipeline-failure

name: Sources health

# Fase 10: valida contra la fuente real -- no solo contra su propia sintaxis
# -- los identificadores que config/competitions.yaml declaro desde la Fase
# 1 como "no verificados todavia" (Eredivisie, Primeira Liga, las tres
# competiciones UEFA, Liga BetPlay Dimayor) y las claves de deporte de The
# Odds API. Ver el docstring de src/deportivas/ingest/sources_health.py
# para el detalle de que cuenta como fallo (una excepcion real, nunca un
# DataFrame vacio -- eso solo significa "sin partidos todavia").
#
# Corre ANTES que daily.yml/odds.yml en el cron (05:00 UTC vs. 06:00 UTC y
# lunes/jueves a las 12:00 UTC) para atrapar un identificador roto antes de
# que la ingesta real desperdicie tiempo de scraping, o la captura de
# cuotas gaste creditos, en algo que iba a fallar de todas formas.
#
# No toca el data lake (ni restaura ni publica el Release "data-lake"):
# esto solo valida configuracion contra la red, no produce datos que valga
# la pena persistir.

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC, todos los dias
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPORTIVAS_THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
  # DEPORTIVAS_FBREF_HEADLESS=false + Xvfb + "xvfb-run" se probaron aqui
  # (confirmado en produccion, ver README "FBref bloquea con CAPTCHA..."):
  # con headless=false soccerdata SI intenta resolver el CAPTCHA de verdad
  # (ya no es el no-op de "Cannot use GUI captcha solver in headless
  # mode"), pero perdio los 5 intentos en las 11 competiciones igual, ~25%
  # mas lento por el overhead de Xvfb. Confirmado, repetible y sin ninguna
  # ganancia: en vez de solo revertir a headless=true y seguir gastando
  # minutos de CI en 11 intentos condenados cada corrida, se desactiva
  # FBref del todo aqui (Settings.fbref_enabled sigue en true por defecto
  # para "deportivas fbref-schedule"/"fbref-stats" invocados a mano, ver
  # .env.example).
  DEPORTIVAS_FBREF_ENABLED: "false"

jobs:
  sources-health:
    name: Validar fuentes en vivo
    runs-on: ubuntu-latest
    # 20, no 90: los 90 minutos originales eran para absorber los reintentos
    # de CAPTCHA de FBref (hasta 5 por competicion, ver ingest/
    # sources_health.py -- "on_issue"). Con DEPORTIVAS_FBREF_ENABLED=false
    # arriba, esta corrida ya no toca FBref en absoluto -- solo Understat/
    # football-data.co.uk/ESPN (llamadas HTTP simples, sin reintentos
    # largos) mas /v4/sports de The Odds API.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Instalar Python 3.11
        run: uv python install 3.11

      - name: Instalar dependencias (lockfile exacto)
        run: uv sync --all-extras --frozen

      - name: Validar fuentes
        run: uv run deportivas sources-health

  notify-on-failure:
    needs: [sources-health]
    if: failure()
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: Sources health
      label: sources-health-failure

      the_odds_api: soccer_uefa_europa_league

  - id: uefa-conference-league
    name: UEFA Conference League
    country: Europe
    sport: football
    tier: 3
    season_start_month: 9
    season_end_month: 5
    sources:
      soccerdata_key: "INT-Conference League"
      fbref: "Conference League"
      understat: null
      club_elo: null
      match_history: null
      espn: "uefa.europa.conf"
    odds:
      the_odds_api: soccer_uefa_europa_conference_league

  # --- Futbol colombiano ---------------------------------------------------
  # No existe fuente abierta de cuotas historicas colombianas. El backtest de
  # esta liga arranca con las cuotas que capturemos desde hoy en adelante.
  - id: col-primera-a
    name: Liga BetPlay Dimayor
    country: Colombia
    sport: football
    tier: 1
    season_start_month: 1
    season_end_month: 12
    sources:
      soccerdata_key: "COL-Primera A"
      fbref: "Primera A"
      understat: null
      club_elo: null
      match_history: null
      espn: "col.1"
    odds:
      the_odds_api: soccer_colombia_primera_a

  # --- Deportes americanos -------------------------------------------------
  - id: usa-nfl
    name: NFL
    country: USA
    sport: american_football
    tier: 1
    season_start_month: 9
    season_end_month: 2
    sources:
      nfl_data_py: true
    odds:
      the_odds_api: americanfootball_nfl

  - id: usa-nba
    name: NBA
    country: USA
    sport: basketball
    tier: 1
    season_start_month: 10
    season_end_month: 6
    sources:
      sportsdataverse: nba
    odds:
      the_odds_api: basketball_nba

  - id: usa-mlb
    name: MLB
    country: USA
    sport: baseball
    tier: 1
    season_start_month: 3
    season_end_month: 10

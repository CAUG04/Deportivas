[project]
name = "deportivas"
version = "0.1.0"
description = "Plataforma de analisis y pronostico deportivo con backtesting point-in-time"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "alembic==1.19.1",
    "psycopg[binary]==3.3.4",
    "duckdb==1.5.5",
    "pyarrow==25.0.1",
    "pandas==3.0.5",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "scikit-learn==1.9.0",
    "statsmodels==0.15.0",
    "lightgbm==4.7.0",
    "pandera==0.32.1",
    "pyyaml==6.0.3",
    "typer==0.27.1",
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "structlog==26.1.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
sources = [
    "soccerdata==1.9.1",
    "nfl-data-py==0.3.2",
    "pybaseball==2.2.7",
    "sportsdataverse==0.1.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "types-PyYAML==6.0.12.20260815",
    "pandas-stubs==3.0.5.260730",
    "hypothesis==6.165.10",
]

[project.scripts]
deportivas = "deportivas.cli:app"

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deportivas"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ARG", "PTH", "TID", "DTZ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
"alembic/*" = ["N", "ARG"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["soccerdata.*", "nfl_data_py.*", "pybaseball.*", "sportsdataverse.*", "lightgbm.*", "statsmodels.*", "duckdb.*", "pandera.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: prueba que necesita red (desactivada por defecto en CI)",
]
filterwarnings = ["error::DeprecationWarning:deportivas.*"]

[tool.coverage.run]
source = ["src/deportivas"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
